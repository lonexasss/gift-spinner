<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gift Case</title>
  <link rel="stylesheet" href="style.css?v=20260906-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div class="noise"></div>

  <header class="top">
    <div class="brand">GIFT<span class="brand-dot">.</span><span class="brand-s">S</span></div>
    <div class="stats">
      <div class="pill pill-balance" id="pillBalance">
        <span class="ico">💎</span><b id="balance">0</b><span class="unit">⭐</span>
      </div>
      <div class="pill pill-opened" id="pillOpened">0</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-ring"></div>
      <div class="hero-emblem">🎁</div>
      <h1>Gift Case</h1>
      <p class="tagline">Открывай кейсы — забирай награды</p>
    </section>

    <section class="cases" id="cases">
      <div class="case ct-common" data-case="common">
        <span class="c-shine"></span>
        <div class="c-emoji">📦</div>
        <div class="c-name">Классик</div>
        <button class="open-btn">Открыть</button>
      </div>
      <div class="case ct-rare" data-case="rare">
        <span class="c-shine"></span>
        <div class="c-emoji">🔷</div>
        <div class="c-name">Мистика</div>
        <button class="open-btn">Открыть</button>
      </div>
      <div class="case ct-legend" data-case="legend">
        <span class="c-shine"></span>
        <div class="c-emoji">👑</div>
        <div class="c-name">Легенда</div>
        <button class="open-btn">Открыть</button>
      </div>
    </section>

    <section class="vault">
      <h2 class="vault-title">Витрина</h2>
      <p class="vault-sub">Редкие находки ждут своих владельцев</p>
      <div class="grid" id="vaultGrid">
        <div class="gift g-rare">🎁</div>
        <div class="gift g-rare">🚀</div>
        <div class="gift g-rare">👾</div>
        <div class="gift">💎</div>
        <div class="gift">🔥</div>
        <div class="gift">🐉</div>
        <div class="gift">⚡</div>
        <div class="gift">🪙</div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p id="footStats">Открытых кейсов: 0</p>
  </footer>

  <div class="scene hidden" id="scene">
    <div class="s-halo"></div>

    <div class="phase phase-box" id="phaseBox">
      <div class="case3d" id="case3d">📦</div>
      <div class="pulse-label" id="pulseLabel">Открываем...</div>
    </div>

    <div class="phase phase-roll hidden" id="phaseRoll">
      <div class="track" id="track"></div>
    </div>

    <div class="phase phase-win hidden" id="phaseWin">
      <div class="orbit" id="orbit"></div>
      <div class="win">
        <div class="win-num">+<b id="winNum">0</b><span class="win-ico">⭐</span></div>
        <p class="win-note">Награда на твоём балансе</p>
        <button class="btn-glow" id="winClose">Забрать</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=20260906-1"></script>
</body>
</html>
